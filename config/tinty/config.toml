shell = "sh -c '{}'"
default-scheme = "base16-chalk"

[[items]]
name = "tinted-herdr"
path = "~/.local/share/agentstart/tinted-herdr"
themes-dir = "themes"
hook = "\"$HOME/.local/bin/herdr-tinty\" apply-theme \"$TINTY_THEME_FILE_PATH\""
supported-systems = ["base16"]

[[items]]
name = "tinted-terminal"
path = "https://github.com/tinted-theming/tinted-terminal"
themes-dir = "themes/ghostty"
hook = """
mkdir -p "$HOME/.config/ghostty/themes"
command cp -f "$TINTY_THEME_FILE_PATH" "$HOME/.config/ghostty/themes/tinted-theming"
killall -SIGUSR2 ghostty 2>/dev/null || true
"""
supported-systems = ["base16"]
