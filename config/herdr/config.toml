[keys]
prefix = "ctrl+space"
previous_tab = ["prefix+p", "alt+1"]
next_tab = ["prefix+n", "alt+2"]
next_workspace = "alt+5"
previous_workspace = "alt+6"

# Herdr 0.8.0 has no move_tab_previous/move_tab_next keybind action yet; the
# helper drives the tab.move API instead. Swap both for the native action once
# the next release lands.
[[keys.command]]
key = "alt+3"
type = "shell"
command = "herdr-move-tab left"
description = "move tab left"

[[keys.command]]
key = "alt+4"
type = "shell"
command = "herdr-move-tab right"
description = "move tab right"

# Herdr 0.8.0 has no keybind action that creates a tab and starts a harness in
# it; the helper chains tab create + agent start. Tabs keep the default numeric
# name; agents are named <kind>-<n>.
[[keys.command]]
key = "prefix+shift+c"
type = "shell"
command = "herdr-agent-tab claude"
description = "new tab running claude"

[[keys.command]]
key = "prefix+shift+o"
type = "shell"
command = "herdr-agent-tab codex"
description = "new tab running codex"

[[keys.command]]
key = "prefix+shift+i"
type = "shell"
command = "herdr-agent-tab pi"
description = "new tab running pi"

[[keys.command]]
key = "prefix+u"
type = "popup"
command = "escape-to-quit agentusage"
description = "usage"
width = "80%"
height = "80%"

# AgentSurface's launcher quits on esc itself, so no escape-to-quit wrapper.
# The whole flow runs in the popup: type the intent, confirm project /
# worktree / harness:model:effort, and the popup closes onto the new
# workspace with the agent started and the intent submitted.
[[keys.command]]
key = "prefix+l"
type = "popup"
command = "agentsurface launch"
description = "launch an agent"
width = "80%"
height = "80%"

# These scoped pairs are free across the machine's current interception chain.
# They cycle the complete Tinty catalog and wrap at both ends.
[[keys.command]]
key = "prefix+["
type = "shell"
command = "herdr-tinty previous"
description = "previous Tinty theme"

[[keys.command]]
key = "prefix+]"
type = "shell"
command = "herdr-tinty next"
description = "next Tinty theme"

[theme]
# Herdr applies [theme.custom] as overrides on a built-in base; every palette
# token is supplied by Tinty below, so the base is only a valid fallback.
name = "terminal"
auto_switch = false

[ui]
agent_panel_sort = "priority"
sidebar_collapsed_mode = "hidden"
sidebar_max_width = 72
# Keep one optical size across Spaces and Agents. State remains distinguishable
# by hue, while unseen idle agents use a hollow dot.
status_indicators = "dots"
# Agent memory per kind ("cc 3.4 / co 2.1"), summed over each agent pane's
# process tree by Funk's machine-config script. The status area ends flush
# against the terminal edge, and command output is trimmed before it is drawn,
# so the clearance has to come from a literal text entry — those keep their
# spaces. It reads as two columns: this pad plus the separator before it.
tab_bar_right = [
  { type = "command", command = "~/.config/herdr/agent-mem.sh", interval_seconds = 10 },
  { type = "text", text = " " },
]

# Managed launch aliases are machine targets, not human identity. The Space
# and conversation tab carry the useful context in the expanded Agent list.
[ui.sidebar.agents]
rows = [["state_icon", "workspace"], ["tab"]]

[ui.toast]
# Avoid the single in-app toast slot used by config reloads. On macOS Herdr's
# system backend prefers terminal-notifier and falls back to AppleScript.
delivery = "system"

# The binary is built from ~/src/herdr by AgentStart's update-herdr, so herdr's
# own update check would only offer a crossgrade back to the stable channel.
[update]
version_check = false

[experimental]
kitty_graphics = true
